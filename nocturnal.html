<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturnal - Kiara Vandewalle</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="nocturnal-page">

<nav class="nav">
    <a href="index.html" class="brand">
        <img src="Images/BARSOLSCHILD.png" alt="Barsol schild">
        <span>De Barsol</span>
    </a>

    <div class="nav-links">
        <a href="index.html#work">Terug naar werk</a>
    </div>

    <div class="progress-bar"></div>
</nav>

<section class="nocturnal-hero">
    <div>
        <p class="label">mijn werk</p>
        <h1>NOCTURNAL</h1>
        <p>
            Voor Nocturnal hielp ik mee met het concept uitwerken, de promoshoot, alle visuals,
            het drukwerk en de fotobooth op het event zelf.
        </p>
    </div>

    <div class="nocturnal-hero-image">
        <img src="Images/NOCTURNAL-BANNER.jpg" alt="">
    </div>
</section>

<section class="nocturnal-intro section reveal">
   
</section>

<section class="nocturnal-gallery">

    <div class="nocturnal-block reveal">
        <div class="nocturnal-title">
            <h2>Promoshoot</h2>
        </div>

        <div class="banner-slider" data-slider>
            <button class="banner-btn prev" data-prev>‹</button>
            <div class="slider-images">
                <img src="Images/NOCTURNAL-PROMOSHOOT (1).jpg" alt="">
                <img src="Images/NOCTURNAL-PROMOSHOOT (2).jpg" alt="">
            </div>
            <button class="banner-btn next" data-next>›</button>
            <div class="slider-dots"></div>
        </div>
    </div>

    <div class="nocturnal-block reveal">
        <div class="nocturnal-title">
            <h2>Visuals</h2>
        </div>

        <div class="banner-slider" data-slider>
            <button class="banner-btn prev" data-prev>‹</button>
            <div class="slider-images">
                <img src="Images/NOCTURNAL-BANNER.jpg" alt="">
                <img src="Images/NOCTURNAL VISUALS 1.jpg" alt="">
                <img src="Images/NOCTURNAL VISUALS2.jpg" alt="">
                <img src="Images/NOCTURNAL VISUALS3.jpg" alt="">
                <img src="Images/NOCTURNAL VISUALS4.jpg" alt="">
                <img src="Images/NOCTURNAL-VISUALS2.jpg" alt="">
                <img src="Images/NOCTURNAL-DRUKWERK (1).jpg" alt="">
                <img src="Images/NOCTURNAL-DRUKWERK (2).jpg" alt="">
            </div>
            <button class="banner-btn next" data-next>›</button>
            <div class="slider-dots"></div>
        </div>
    </div>

    <div class="nocturnal-block reveal">
        <div class="nocturnal-title">
            <h2>Fotobooth</h2>
        </div>

        <div class="banner-slider" data-slider>
            <button class="banner-btn prev" data-prev>‹</button>
            <div class="slider-images">
                <img src="Images/NOCTURNAL-FOTOBOOTH (1).jpg" alt="">
                <img src="Images/NOCTURNAL-FOTOBOOTH (2).jpg" alt="">
                <img src="Images/NOCTURNAL-FOTOBOOTH (3).jpg" alt="">
                <img src="Images/NOCTURNAL-FOTOBOOTH (4).jpg" alt="">
                <img src="Images/NOCTURNAL-FOTOBOOTH (5).jpg" alt="">
                <img src="Images/NOCTURNAL-FOTOBOOTH.jpg" alt="">
            </div>
            <button class="banner-btn next" data-next>›</button>
            <div class="slider-dots"></div>
        </div>
    </div>

</section>

<section class="case-end">
    <a href="index.html#work" class="btn secondary">Terug naar mijn werk</a>
</section>

<script src="scripts.js"></script>

</body>
</html>
