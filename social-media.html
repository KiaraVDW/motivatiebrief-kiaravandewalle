<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social media - Kiara Vandewalle</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="cursor-glow"></div>
<div class="progress-bar"></div>

<nav class="nav">
    <a href="index.html" class="brand">
        <img src="Images/BARSOLSCHILD.png" alt="Barsol schild">
        <span>De Barsol</span>
    </a>

    <div class="nav-links">
        <a href="index.html#work">Terug naar werk</a>
    </div>
</nav>

<section class="case-hero reveal">
    <div>
        <p class="label">Mijn werk</p>
        <h1>Sociale media</h1>
        <p>
            Voor De Barsol zorgde ik ervoor dat onze sociale media up-to-date bleef.
            Ik maakte visuals voor Instagram en Facebook.
        </p>
    </div>
</section>

<section class="case-section reveal">
    <div class="case-heading">
        <p class="label">Instagram</p>
    </div>

    <div class="insta-grid">
        <img src="Images/INSTA VOORBEELD 1.jpg" alt="">
        <img src="Images/INSTA VOORBEELD 2.jpg" alt="">
        <img src="Images/INSTA VOORBEELD 3.png" alt="">
    </div>
</section>

<section class="case-section grey reveal">
    <div class="case-heading">
        <p class="label">Instagram feed</p>
    </div>

    <div class="wide-preview">
        <img src="Images/INSTA VOORBEELD.png" alt="">
    </div>
</section>

<section class="case-section reveal">
    <div class="case-heading">
        <p class="label">Facebook</p>
    </div>

        <img src="Images/SPONSORPOST FACEBOOK.jpg" alt="">
    </div>
</section>

<section class="case-section grey reveal">
    <div class="case-heading">
        <p class="label">Facebook Clubledenpagina</p>

    <div class="wide-preview">
        <img src="Images/CLUBLEDEN BANNER FACEBOOK.jpg" alt="">
    </div>
</section>

<section class="case-end">
    <a href="index.html#work" class="btn secondary">Terug naar mijn werk</a>
</section>

<script src="scripts.js"></script>

</body>
</html>
