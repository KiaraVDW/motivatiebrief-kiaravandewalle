<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banners - Kiara Vandewalle</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="banners-page">

<div class="cursor-glow"></div>
<div class="progress-bar"></div>

<nav class="nav">
    <a href="index.html" class="brand">
        <img src="Images/BARSOLSCHILD.png" alt="Barsol schild">
        <span>De Barsol</span>
    </a>

    <div class="nav-links">
        <a href="index.html#work">Terug naar werk</a>
    </div>
</nav>

<section class="banners-showcase-hero reveal">
    <div>
        <p class="label">Mijn werk</p>
        <h1>Banners</h1>
    </div>

    <div class="hero-banner-stack">
        <img src="Images/BANNER-ACTIVITEIT-1.jpg" alt="">
        <img src="Images/BANNER-FEESTJE-1.jpg" alt="">
        <img src="Images/BANNER-CANTUS-1.jpg" alt="">
    </div>
</section>

<section class="banners-gallery">

    <div class="banner-showcase reveal">
        <h2>Activiteiten</h2>

        <div class="banner-slider" data-slider>
            <button class="banner-btn prev" data-prev>‹</button>
            <div class="slider-images">
                <img src="Images/BANNER-ACTIVITEIT-1.jpg" alt="">
                <img src="Images/BANNER-ACTIVITEIT-2.jpg" alt="">
                <img src="Images/BANNER-ACTIVITEIT-3.jpg" alt="">
                <img src="Images/BANNER-ACTIVITEIT-4.jpg" alt="">
                <img src="Images/BANNER-ACTIVITEIT-5.jpg" alt="">
            </div>
            <button class="banner-btn next" data-next>›</button>
            <div class="slider-dots"></div>
        </div>
    </div>

    <div class="banner-showcase reveal">
        <h2>Sport & Cultuur</h2>

        <div class="banner-slider" data-slider>
            <button class="banner-btn prev" data-prev>‹</button>
            <div class="slider-images">
                <img src="Images/BANNER-S&C-1.jpg" alt="">
                <img src="Images/BANNER-S&C-2.jpg" alt="">
                <img src="Images/BANNER-S&C-3.jpg" alt="">
                <img src="Images/BANNER-S&C-4.jpg" alt="">
            </div>
            <button class="banner-btn next" data-next>›</button>
            <div class="slider-dots"></div>
        </div>
    </div>

    <div class="banner-showcase reveal">
        <h2>Cantussen</h2>

        <div class="banner-slider" data-slider>
            <button class="banner-btn prev" data-prev>‹</button>
            <div class="slider-images">
                <img src="Images/BANNER-CANTUS-1.jpg" alt="">
                <img src="Images/BANNER-CANTUS-2.jpg" alt="">
                <img src="Images/BANNER-CANTUS-3.jpg" alt="">
                <img src="Images/BANNER-CANTUS-4.jpg" alt="">
            </div>
            <button class="banner-btn next" data-next>›</button>
            <div class="slider-dots"></div>
        </div>
    </div>

    <div class="banner-showcase reveal">
        <h2>Feestjes</h2>

        <div class="banner-slider" data-slider>
            <button class="banner-btn prev" data-prev>‹</button>
            <div class="slider-images">
                <img src="Images/BANNER-FEESTJE-1.jpg" alt="">
                <img src="Images/BANNER-FEESTJE-2.jpg" alt="">
                <img src="Images/BANNER-FEESTJE-3.jpg" alt="">
            </div>
            <button class="banner-btn next" data-next>›</button>
            <div class="slider-dots"></div>
        </div>
    </div>

    <div class="banner-showcase reveal">
        <h2>Visuals</h2>

        <div class="banner-slider" data-slider>
            <button class="banner-btn prev" data-prev>‹</button>
            <div class="slider-images">
                <img src="Images/VISUAL-STARTWEEK-1.jpg" alt="">
                <img src="Images/VISUAL-STARTWEEK-2.jpg" alt="">
                <img src="Images/VISUAL-STARTWEEK-3.jpg" alt="">
                <img src="Images/VISUAL-BLACKOUT-1.jpg" alt="">
            </div>
            <button class="banner-btn next" data-next>›</button>
            <div class="slider-dots"></div>
        </div>
    </div>

</section>

<section class="case-end">
    <a href="index.html#work" class="btn secondary">Terug naar mijn werk</a>
</section>

<script src="scripts.js"></script>

</body>
</html>
