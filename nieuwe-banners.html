<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieuwe banners - Kiara Vandewalle</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="event-page">

<nav class="nav">
    <a href="index.html" class="brand">
        <img src="Images/BARSOLSCHILD.png" alt="Barsol schild">
        <span>De Barsol</span>
    </a>

    <div class="nav-links">
        <a href="index.html#vision">Terug naar visie</a>
    </div>

    <div class="progress-bar"></div>
</nav>

<section class="events-hero">
    <div>
        <p class="label">Mijn visie</p>
        <h1>Nieuwe banners</h1>
    </div>

    <div class="hero-banner-stack">
         <img src="Images/NIEUWEBANNER2.jpg" alt="">
        <img src="Images/NIEUWBANNER1.jpg" alt="">

    </div>
</section>

<section class="events-gallery reveal">
    <p class="label">Nieuwe banners</p>


    <div class="event-slider" data-slider>
        <button class="event-btn prev" data-prev>‹</button>

        <div class="slider-images">
            <img src="Images/NIEUWBANNER1.jpg" alt="">
            <img src="Images/NIEUWEBANNER2.jpg" alt="">
        
        </div>

        <button class="event-btn next" data-next>›</button>
        <div class="slider-dots"></div>
    </div>
</section>

<section class="case-end">
    <a href="index.html#vision" class="btn secondary">Terug naar mijn visie</a>
</section>

<script src="scripts.js"></script>

</body>
</html>
